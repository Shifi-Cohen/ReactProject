services:
  - type: web
    name: stam-client
    runtime: static
    rootDir: client/clientStam
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/clientStam/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # כתובת ה-API נקבעת בזמן הבנייה. אחרי שינוי צריך Build מחדש.
      # הערך: https://<שם-השרת>.onrender.com/api
      - key: VITE_API_URL
        sync: false
